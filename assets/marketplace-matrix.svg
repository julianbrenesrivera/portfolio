<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative marketplace diagnostic matrix</title>
  <desc id="desc">Synthetic four-quadrant traffic and conversion diagnostic framework.</desc>
  <rect width="1000" height="760" rx="28" fill="#FEFEFE"/>
  <text x="72" y="68" font-family="Inter, Arial, sans-serif" font-size="17" letter-spacing="2.2" fill="#66707A">ILLUSTRATIVE FRAMEWORK · SYNTHETIC EXAMPLE</text>
  <text x="72" y="112" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#141415">Traffic × conversion diagnostic view</text>

  <text x="540" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="2" fill="#66707A">CONVERSION →</text>
  <text x="182" y="227" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#66707A">LOWER</text>
  <text x="592" y="227" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#66707A">HIGHER</text>

  <g transform="translate(150,250)">
    <rect x="0" y="0" width="360" height="190" rx="20" fill="#F1F8FE" stroke="#C8D4DF"/>
    <rect x="380" y="0" width="360" height="190" rx="20" fill="#CDE4FB" stroke="#B7C9D8"/>
    <rect x="0" y="210" width="360" height="190" rx="20" fill="#FEFEFE" stroke="#C8D4DF"/>
    <rect x="380" y="210" width="360" height="190" rx="20" fill="#E6F2FE" stroke="#C8D4DF"/>

    <text x="-42" y="96" text-anchor="middle" transform="rotate(-90 -42 96)" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#66707A">HIGHER TRAFFIC</text>
    <text x="-42" y="306" text-anchor="middle" transform="rotate(-90 -42 306)" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#66707A">LOWER TRAFFIC</text>

    <text x="28" y="42" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#141415">Investigate friction</text>
    <text x="28" y="78" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D545B">Traffic exists, but conversion lags.</text>
    <text x="28" y="111" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D545B">Question: what is blocking demand?</text>

    <text x="408" y="42" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#141415">Protect + scale</text>
    <text x="408" y="78" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D545B">Strong traffic and conversion signals.</text>
    <text x="408" y="111" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D545B">Question: what should be preserved?</text>

    <text x="28" y="252" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#141415">Fix foundations</text>
    <text x="28" y="288" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D545B">Both signals need investigation.</text>
    <text x="28" y="321" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D545B">Question: which constraint comes first?</text>

    <text x="408" y="252" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#141415">Unlock discovery</text>
    <text x="408" y="288" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D545B">Conversion is healthy; traffic is lower.</text>
    <text x="408" y="321" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D545B">Question: how can reach expand?</text>
  </g>

  <text x="500" y="704" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#66707A">
    Signal → diagnostic question → account priority → customer conversation → action → review
  </text>
</svg>